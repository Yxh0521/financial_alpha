[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-news-daily-brief"
version = "0.1.0"
description = "Automated pipeline to crawl daily financial news and generate 9AM Beijing summaries with LLMs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Open Source Contributors"}
]
license = {text = "MIT"}
dependencies = [
  "apscheduler>=3.10.4",
  "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
financial-news-bot = "financial_news_bot.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
